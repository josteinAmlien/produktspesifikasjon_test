- name: Kommune
  physicalName: kommune
  logicalType: object
  physicalType: table
  description: 'inndeling i administrative og politiske enheter innenfor fylket


    Merknad: Tilsvarer NUTS 5 og LAU 2 på internasjonalt statistisk nivå'
  customProperties:
  - property: sosiObjektType
    value: Kommune
  - property: inheritsFrom
    value: SOSI_Objekt_Flater
  - property: associations
    value:
    - role: avgrensesAvAvtaltAvgrensningslinje
      target: AvtaltAvgrensningslinje
      cardinality: 0..*
    - role: avgrensesAvFylkesgrense
      target: Fylkesgrense
      cardinality: 0..*
    - role: avgrensesAvRiksgrense
      target: Riksgrense
      cardinality: 0..*
    - role: avgrensesAvTerritorialgrense
      target: Territorialgrense
      cardinality: 0..*
    - role: avgrensesAvKommunegrense
      target: Kommunegrense
      cardinality: 0..*
  properties:
  - name: oppdateringsdato
    logicalType: date
    description: 'dato for siste endring på objektetdataene


      -Definition-

      Date and time at which this version of the spatial object was inserted or changed
      in the spatial data set.'
    required: true
  - name: område
    logicalType: object
    physicalType: geometry(Surface)
    required: true
    customProperties:
    - property: geometryType
      value: Surface
  - name: kommunenavn
    logicalType: string
    description: offisielt navn på kommunen
    required: true
  - name: kommunenummer
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/inndelinger/inndelingsbase/kommunenummer
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: Kommunenummer
    - property: asDictionary
      value: 'true'
    description: 'nummerering av kommuner i henhold til Statistisk sentralbyrå sin
      offisielle liste


      Merknad: Det presiseres at kommune alltid skal ha 4 siffer, dvs. eventuelt med
      ledende null. Kommune benyttes for kopling mot en rekke andre registre som også
      benytter 4 siffer.


      -- Definition - -

      numbering of municipalities in accordance with Statistics Norway’s official
      list

      Note: It must be following that municipality number always consists of 4 digits,
      i.e. sometimes with leading zero. Municipality is used for establishing relations
      to a number of other registers which also use 4 digits.'
    required: true
  - name: fylkesnummer
    logicalType: string
    description: nummerering av kommuner i henhold til Statistisk sentralbyrå sin
      offisielle liste
    required: true
  - name: fylkesnavn
    logicalType: string
    description: offisielt navn på fylket
    required: true
