  description: 'koordinatbestemt punkt som er påvist, beskrevet og/eller markert spesielt
    i den geografiske avgrensinga av teigen



    -- Definition --

    point established by coordinates, which is proven, described and/or marked specifically
    in the geographical demarcation of the parcel Note: Can also be am auxiliary point
    for technical registration purposes Note: A boundary point is placed either at
    the beginning or end of a parcel boundary.'
