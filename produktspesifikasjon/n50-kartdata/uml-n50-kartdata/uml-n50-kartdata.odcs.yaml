  - name: streng
    logicalType: string
    description: teksten som skal presenteres på kartet
    required: true
  - name: oppdateringsdato
    logicalType: date
    description: 'dato for siste endring på objektetdataene


      -Definition-

      Date and time at which this version of the spatial object was inserted or changed
      in the spatial data set.'
  - name: datafangstdato
    logicalType: date
    description: 'dato når objektet siste gang ble registrert/observert/målt i terrenget


      Merknad: I mange tilfeller er denne forskjellig fra Oppdateringsdato, da registrerte
      endringer kan bufres i en kortere eller lengre periode før disse legges inn
      i databasen.

      Ved førstegangsregistrering settes Datafangstdato lik førsteDatafangstdato.'
  - name: tekstformatering
    logicalType: object
    properties:
    - name: tekstReferansepunkt
      logicalType: object
      properties:
      - name: tekstReferansePunktNord
        logicalType: string
        authoritativeDefinitions:
        - url: https://register.geonorge.no/sosi-kodelister/kartdata/tekstreferansepunktnord
          type: businessDefinition
        customProperties:
        - property: sosiCodeList
          value: TekstReferansePunktNord
        - property: asDictionary
          value: 'true'
        description: 'vertikal plassering av teksten.

          Merknad: N50 Kartdata plasseres alltid teksten langs bunnlinja, dvs. TRNORD
          = 0'
        required: true
      - name: tekstReferansePunktØst
        logicalType: string
        authoritativeDefinitions:
        - url: https://register.geonorge.no/sosi-kodelister/kartdata/tekstreferansepunkt%C3%B8st
          type: businessDefinition
        customProperties:
        - property: sosiCodeList
          value: TekstReferansePunktØst
        - property: asDictionary
          value: 'true'
        description: horisontal plassering av teksten
        required: true
      description: tekstens referansepunkt er det stedet på teksten som en tekstplassering
        refererer seg til.
    - name: tegnavstand
      logicalType: integer
      description: avstanden mellom bokstavene i teksten, enhet er prosent
    - name: skriftkode
      logicalType: string
      authoritativeDefinitions:
      - url: https://register.geonorge.no/sosi-kodelister/kartdata/skriftkode
        type: businessDefinition
      customProperties:
      - property: sosiCodeList
        value: Skriftkode
      - property: asDictionary
        value: 'true'
      description: produktavhengig koplingsnøkkel mot presentasjonsinformasjon
    - name: skrifttype
      logicalType: string
      description: angivelse av den skrifttype eller font som skal benyttes. Default
        skrifttype er ARIAL
    - name: referansemålestokk
      logicalType: integer
      description: 'egenskap som beskriver hvilken målestokk (oppgitt som målestokkstall)
        denne teksten er redigert for, både størrelse og

        plassering. Kan benyttes for å velge hvilke tekster som skal tegnes ut i ulike
        målestokker.'
    description: ulike egenskaper til brukt for å presentere teksten på mediumet
    required: true
  - name: fulltekst
    logicalType: string
    description: navnet i SSR som skal vises på kartet. Vil i de fleste tilfeller
      være likt Streng, men kan avvike dersom det av kartografiske hensyn bare vises
      deler av navnet e.l.
    required: true
  - name: teksttype
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/kartdata/teksttype
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: Teksttype
    - property: asDictionary
      value: 'true'
    description: kodeliste som angir hva slags type objekt teksten beskriver.
    required: true
